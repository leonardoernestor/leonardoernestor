name: Pergunta de TI
description: Tire uma dúvida sobre suporte, sistemas, redes ou automação.
title: "[TI] "
body:
  - type: dropdown
    id: area
    attributes:
      label: Assunto
      options:
        - Windows
        - Linux
        - macOS
        - Redes e internet
        - Microsoft 365 ou Google Workspace
        - Hardware e manutenção
        - Scripts e automação
        - Outro
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Qual é a sua dúvida?
      description: Inclua a mensagem de erro e o que você já tentou. Não informe senhas, tokens ou dados pessoais.
      placeholder: Descreva o problema e o resultado esperado.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Contexto (opcional)
      description: Informe sistema operacional, versão e detalhes relevantes do ambiente.
      placeholder: "Exemplo: Windows 11, notebook conectado ao Wi-Fi de casa."